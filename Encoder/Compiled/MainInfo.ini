; Ativar habilidades de Cerco ao Castelo em todos os mapas
; Você também precisa ativar isso no Common.data do servidor
; 1: Ativar em todos os mapas
; 0: Ativar apenas no Cerco ao Castelo
;==================================================
EnableCsSkillsAllMaps = 1

;==================================================
; Configuração do modo de exibição para nível de usuário (RankUserSwitch)
; 0: Exibição completa
; 1: Ocultar estatísticas
; 2: Ocultar logo
; 3: Ocultar estatísticas e logo
; 4: Exibir logo acima da cabeça
; 5: Remover (Desativar)
