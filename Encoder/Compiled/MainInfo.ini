[Custom]
;==================================================
; Posição do logo ao tirar screenshot
; Logo: Data\Interface\HUD\MU-logo.OZT
; 0: Desligado
; 1: Posição superior esquerda
; 2: Posição superior direita
; 3: Posição inferior esquerda
; 4: Posição inferior direita
; 5: Posição central
;==================================================
PrintLogo = 0

;==================================================
; Remover personagens na tela de criação
; 0: Normal (Não remove)
; 1: Remove Summoner/DarkLord/RageFighter
; 2: Remove Summoner/RageFighter
; 3: Remove RageFighter
;==================================================
RemoveClass = 0

;==================================================
; Configuração de qualidade FPS
; FpsRenderMax: Limite máximo de redução de FPS
; FpsWindowsOption: Ativar pergunta de FPS ao entrar no jogo (Ativar:1/Desativar:0)
;==================================================
FpsRenderMax = 120
FpsWindowsOption = 1

;==================================================
; Exibir logo da guilda do personagem durante o chat
; 0: Desligado
; 1: Ligado
;==================================================
RenderGuildLogo = 1

;==================================================
; Definir o nível máximo de refinamento de itens
; Nível máximo: 10 ~ 15
; - Mix máximo até nível 10
; - Mix máximo até nível 11
; - Mix máximo até nível 12
; - Mix máximo até nível 13
; - Mix máximo até nível 14
; - Mix máximo até nível 15
;==================================================
MaxItemLevelOn = 10

;==================================================
; Ativar ou desativar o sistema de (mix) de asas
; Asas nível 3 da terceira missão para jogadores
; - Misturar (Mix) Feather Of Condor
; - Misturar (Mix) Asas nível 3
;==================================================
ShutdownLevelWing3 = 1

;==================================================
; Ativar recurso de negociação com moedas
; - 0: Desligado
; - 1: Ligado
;==================================================
EnableTradeCoin = 1

;==================================================
; Ativar recurso de lembrar conta
; - 0: Desligado
; - 1: Ligado
;==================================================
EnableRememberAccount = 1

;==================================================
; Ativar banco de joias
; - 0: Desligado
; - 1: Ligado
;==================================================
EnableJewelOfInventory = 1

;==================================================
; Ativar janela de Informações de Reset
; - 0: Desligado
; - 1: Ligado
;==================================================
EnableWindowsResetInfo = 1

